name: Deploy to Firebase

on:
  push:
    branches:
      - main
  # Redespliegue manual (p. ej. después de cambiar un secreto de Firebase: las funciones leen los secretos al iniciar).
  workflow_dispatch:
    inputs:
      deploy_firestore:
        description: 'Desplegar también índices y reglas de Firestore (probá las reglas en el emulador antes)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── Secretos de GitHub necesarios: falla ANTES de construir, con un mensaje claro ─────────
      - name: Verify required secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=""
          for v in FIREBASE_SERVICE_ACCOUNT FIREBASE_PROJECT_ID VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos de GitHub (Settings → Secrets and variables → Actions):$missing"
            exit 1
          fi
          echo "Secretos de GitHub presentes."

      # ── Build frontend ────────────────────────────────────────────────────
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # ── Install function deps ─────────────────────────────────────────────
      - name: Install function deps
        run: npm ci
        working-directory: functions

      # ── Write service account JSON to disk ────────────────────────────────
      # firebase-tools lee GOOGLE_APPLICATION_CREDENTIALS (ruta a archivo),
      # no acepta JSON inline — así que lo escribimos a un archivo temporal.
      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Deploy to Firebase
        run: |
          npx firebase-tools deploy \
            --only hosting,functions \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive \
            --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      # ── Índices y reglas de Firestore: solo a pedido (workflow_dispatch → deploy_firestore) ───────
      # Las reglas de firestore.rules no se pueden probar en CI: probarlas en el emulador antes de activar esta opción.
      - name: Deploy Firestore indexes and rules
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_firestore }}
        run: |
          npx firebase-tools deploy \
            --only firestore:indexes,firestore:rules \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --non-interactive \
            --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
