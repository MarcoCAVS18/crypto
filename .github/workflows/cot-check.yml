name: COT check

# Diagnóstico temporal (solo lectura): ¿por qué "faltan COT"? Prueba las consultas a la CFTC y lee el estado real de la API.
on:
  workflow_dispatch:
  push:
    branches: [claude/cot-diagnosis]
    paths: ['.github/workflows/cot-check.yml']

permissions:
  contents: read

jobs:
  cot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: CFTC y API real
        env:
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          B='https://publicreporting.cftc.gov/resource/6dca-aqww.json'
          M='market_and_exchange_names=GOLD%20-%20COMMODITY%20EXCHANGE%20INC.'
          t() { # $1 = nombre, $2 = url
            out=$(curl -sS -m 60 -o /tmp/r.json -w '%{http_code} %{size_download}B %{time_total}s' "$2" 2>&1)
            echo "- $1: $out · filas: $(jq 'length' /tmp/r.json 2>/dev/null || echo '?') · $(jq -r 'if type=="object" then (.message // .error // "") else "" end' /tmp/r.json 2>/dev/null | cut -c1-160)"
          }
          {
            echo "## COT check"
            t "ACTUAL en main (limit=4 viejo)" "$B?$M&\$limit=4&\$order=as_of_date_in_form_yymmdd%20DESC"
            t "P2 (limit=160 completo, order yymmdd)" "$B?$M&\$limit=160&\$order=as_of_date_in_form_yymmdd%20DESC"
            t "PR #53 (select + report_date)" "$B?$M&\$select=as_of_date_in_form_yymmdd,report_date_as_yyyy_mm_dd,noncomm_positions_long_all,noncomm_positions_short_all,open_interest_all&\$limit=160&\$order=report_date_as_yyyy_mm_dd%20DESC"
            echo
            echo "### Estado real de las fuentes en el sitio"
            curl -sS -m 60 "https://${PID}.web.app/api/health/deep" -o /tmp/deep.json
            jq -r '.goldContext | {cached, fetchedAt, ageMinutes, sources: (.sources // null)}' /tmp/deep.json
            echo
            echo "### Contexto cacheado (fuente COT)"
            jq -r '.goldContext.sources.cot // "sin dato"' /tmp/deep.json
            echo
            echo "### Advertencias"
            jq -r '.warnings[]?' /tmp/deep.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
