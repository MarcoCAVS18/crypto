name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── API (functions/) ──────────────────────────────────────────────────
      - name: Install function deps
        run: npm ci
        working-directory: functions

      - name: Test functions
        run: npm test
        working-directory: functions

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend
