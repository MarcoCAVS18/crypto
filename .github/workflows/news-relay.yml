name: News relay

# Trae los titulares desde GitHub Actions (los feeds bloquean/limitan las IPs de Google Cloud, donde corre la API) y los
# guarda en Firestore (_ai_cache/headlines_relay_*). La API los lee cuando sus propias consultas devuelven poco.
# Usa el mismo secreto que el deploy: FIREBASE_SERVICE_ACCOUNT + FIREBASE_PROJECT_ID.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - name: Verificar secretos
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$PID" ]; then echo "::error::Faltan FIREBASE_SERVICE_ACCOUNT / FIREBASE_PROJECT_ID"; exit 1; fi
      - name: Traer titulares y guardarlos en Firestore
        working-directory: functions
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/newsRelay.mjs
          rm -f "$RUNNER_TEMP/sa.json"
